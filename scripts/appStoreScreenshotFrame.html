<!doctype html><html><head><style>
        * { box-sizing: border-box; margin: 0; }
        body {
            width: {{canvasWidth}}px; height: {{canvasHeight}}px; overflow: hidden;
            font-family: -apple-system, system-ui, sans-serif; color: #1d1d1f;
            background: linear-gradient(160deg, #f5f7fb 0%, #dde5f0 100%);
            display: flex; flex-direction: column; align-items: center;
        }
        h1 { margin-top: 44px; font-size: 46px; font-weight: 700; letter-spacing: -0.02em; }
        p.subtitle { margin-top: 10px; font-size: 22px; color: #515154; }
        .window {
            position: relative; margin-top: 34px; width: {{viewportWidth}}px; border-radius: 12px; overflow: hidden;
            background: #fff; box-shadow: 0 0 0 0.5px rgba(0,0,0,0.25), 0 24px 60px rgba(30,45,70,0.28);
        }
        .toolbar {
            height: 52px; display: flex; align-items: center; gap: 18px; padding: 0 18px;
            background: #f6f6f6; border-bottom: 1px solid #d9d9d9; color: #6e6e73;
        }
        .lights { display: flex; gap: 8px; margin-right: 6px; }
        .lights span { width: 12px; height: 12px; border-radius: 50%; }
        .icon { display: block; height: 16px; }
        .icon svg { height: 100%; display: block; }
        .address {
            flex: 1; margin: 0 40px; height: 32px; border-radius: 8px; background: #e8e8ea;
            display: flex; align-items: center; justify-content: center; font-size: 14px; color: #3a3a3c;
        }
        /* The 38px icon at 2x, so it is never resampled. */
        .extension { width: 19px; height: 19px; }
        .page { display: block; width: {{viewportWidth}}px; height: {{viewportHeight}}px; }
        .popover {
            position: absolute; top: 60px; border-radius: 10px; background: #fff;
            box-shadow: 0 0 0 0.5px rgba(0,0,0,0.2), 0 16px 40px rgba(0,0,0,0.25);
        }
        .popover img { display: block; width: 420px; border-radius: 10px; }
        .arrow {
            position: absolute; top: -7px; width: 14px; height: 14px; background: #fff;
            transform: rotate(45deg); box-shadow: -0.5px -0.5px 0 0 rgba(0,0,0,0.2);
        }
    </style></head><body>
        <!-- Filled in by scripts/appStoreScreenshots.ts: a caption and a Safari-style window around a captured page. -->
        <h1>{{title}}</h1>
        <p class="subtitle">{{subtitle}}</p>
        <div class="window">
            <div class="toolbar">
                <div class="lights"><span style="background:#ff5f57"></span><span style="background:#febc2e"></span><span style="background:#28c840"></span></div>
                <span class="icon"><svg viewBox="0 0 20 16"><rect x="1" y="1" width="18" height="14" rx="3" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M7 1v14" stroke="currentColor" stroke-width="1.6"/></svg></span>
                <span class="icon"><svg viewBox="0 0 12 18"><path d="M9 2 2 9l7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
                <span class="icon"><svg viewBox="0 0 12 18"><path d="m3 2 7 7-7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
                <div class="address">{{displayedHost}}</div>
                <img class="extension" src="{{toolbarIcon}}">
                <span class="icon"><svg viewBox="0 0 16 20"><path d="M8 1v12M4 5l4-4 4 4M5 8H2v11h12V8h-3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
                <span class="icon"><svg viewBox="0 0 16 16"><path d="M8 2v12M2 8h12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></span>
                <span class="icon"><svg viewBox="0 0 18 18"><rect x="1" y="4" width="13" height="13" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M4 1h10a3 3 0 0 1 3 3v10" fill="none" stroke="currentColor" stroke-width="1.6"/></svg></span>
            </div>
            <img class="page" src="{{page}}">
            <div class="popover" hidden><div class="arrow"></div><img src="{{popup}}"></div>
        </div>
        <script>
            // Shows the popover only when a popup image was given, centered under the
            // extension's toolbar icon and kept inside the window.
            const popover = document.querySelector('.popover');
            if (popover.querySelector('img').getAttribute('src') !== '') {
                popover.hidden = false;
                const windowRect = document.querySelector('.window').getBoundingClientRect();
                const icon = document.querySelector('.extension').getBoundingClientRect();
                const iconCenter = icon.left + icon.width / 2 - windowRect.left;
                const left = Math.min(iconCenter - popover.offsetWidth / 2, windowRect.width - popover.offsetWidth - 8);
                popover.style.left = left + 'px';
                popover.querySelector('.arrow').style.left = (iconCenter - left - 7) + 'px';
            }
        </script>
    </body></html>
