<!doctype html><html><head><style>
        * { box-sizing: border-box; margin: 0; }
        body {
            width: {{canvasWidth}}px; height: {{canvasHeight}}px; overflow: hidden;
            font-family: -apple-system, system-ui, sans-serif; color: #1d1d1f;
            background: linear-gradient(160deg, #f5f7fb 0%, #dde5f0 100%);
            display: flex; flex-direction: column; align-items: center;
        }
        h1 { margin-top: 40px; font-size: 44px; font-weight: 700; letter-spacing: -0.02em; }
        p.subtitle { margin-top: 10px; font-size: 21px; color: #515154; }
        .window {
            margin-top: 30px; width: {{viewportWidth}}px; border-radius: 12px; overflow: hidden;
            background: #fff; box-shadow: 0 0 0 0.5px rgba(0,0,0,0.25), 0 24px 60px rgba(30,45,70,0.28);
        }
        /* Deliberately generic: no window buttons or browser-specific controls. */
        .toolbar {
            height: 48px; display: flex; align-items: center; gap: 16px; padding: 0 18px;
            background: #f4f5f7; border-bottom: 1px solid #dcdee3; color: #6e6e73;
        }
        .icon { display: block; height: 16px; }
        .icon svg { height: 100%; display: block; }
        .address {
            flex: 1; margin: 0 12px; height: 30px; border-radius: 15px; background: #e6e8ec;
            display: flex; align-items: center; padding: 0 16px; font-size: 14px; color: #3a3a3c;
        }
        /* The 38px icon at 2x, so it is never resampled. */
        .extension { width: 19px; height: 19px; }
        .stage { position: relative; }
        .page { display: block; width: {{viewportWidth}}px; height: {{viewportHeight}}px; }
        /* The animation's pointer, placed by scripts/readmeAnimation.ts; the tip is at the element's origin. */
        .cursor { position: absolute; left: 0; top: 0; width: 28px; height: 28px; pointer-events: none; }
        .cursor svg { display: block; overflow: visible; }
        .cursor .press { opacity: 0; }
        .cursor.pressed .press { opacity: 1; }
    </style></head><body>
        <!-- Filled in by scripts/readmeHero.ts and scripts/readmeAnimation.ts: a caption and a browser-neutral window around a captured page. -->
        <h1>{{title}}</h1>
        <p class="subtitle">{{subtitle}}</p>
        <div class="window">
            <div class="toolbar">
                <span class="icon"><svg viewBox="0 0 12 18"><path d="M9 2 2 9l7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
                <span class="icon"><svg viewBox="0 0 12 18"><path d="m3 2 7 7-7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
                <span class="icon"><svg viewBox="0 0 18 18"><path d="M15 9a6 6 0 1 1-1.8-4.3M15 2v4h-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
                <div class="address">{{displayedHost}}</div>
                <img class="extension" src="{{toolbarIcon}}">
            </div>
            <div class="stage">
                <img class="page" src="{{page}}">
                <div class="cursor" hidden><svg viewBox="0 0 28 28" width="28" height="28">
                    <circle class="press" cx="0" cy="0" r="16" fill="rgba(37,99,235,0.22)" stroke="rgba(37,99,235,0.55)" stroke-width="1.5"/>
                    <path d="M1 1v19.5l5.2-4.9 3.4 7.9 3.6-1.5-3.4-7.8h7.2z" fill="#111" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/>
                </svg></div>
            </div>
        </div>
    </body></html>
