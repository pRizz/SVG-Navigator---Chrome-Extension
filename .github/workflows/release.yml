name: Release

# Pushing a tag like `v2.11` (matching src/manifest.json's version) builds the
# extension, runs every test against the exact files that will be uploaded, and
# submits them to the Chrome Web Store and Firefox Add-ons. Both stores still
# review the submission before users get it.
#
# Running this workflow manually from a branch is a dry run: it builds and tests
# the release files and checks the store credentials (read-only), but publishes
# nothing.
#
# Required secrets (see README "Releasing"): CWS_SERVICE_ACCOUNT_KEY,
# CWS_PUBLISHER_ID, AMO_JWT_ISSUER, AMO_JWT_SECRET.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

env:
  CWS_EXTENSION_ID: pefngfjmidahdaahgehodmfodhhhofkl

jobs:
  verify:
    runs-on: ubuntu-26.04
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
    - uses: actions/checkout@v7

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version-file: package.json

    - name: Read and check version
      id: version
      run: bun scripts/checkReleaseVersion.ts

    - name: Cache Puppeteer browsers
      uses: actions/cache@v6
      with:
        path: ~/.cache/puppeteer
        key: puppeteer-${{ runner.os }}-${{ hashFiles('bun.lock') }}

    - name: Install dependencies
      run: bun install --frozen-lockfile

    - name: Install test browsers
      run: bunx --bun puppeteer browsers install chrome && bunx --bun puppeteer browsers install firefox

    - name: Type check, lint, unit test, and Bright Builds checks
      run: bun run verify

    - name: Build release files
      run: bun run build:all && bun run zip:source

    - name: Collect release files
      run: |
        mkdir release
        cp "packages/svg-navigator---chrome-extension.v${{ steps.version.outputs.version }}.chrome.zip" release/chrome.zip
        cp "packages/svg-navigator---chrome-extension.v${{ steps.version.outputs.version }}.firefox.xpi" release/firefox.xpi
        cp svg-navigator-source.zip release/source.zip

    - name: Run UI tests against the release files
      run: |
        unzip -q release/chrome.zip -d unpacked-chrome
        unzip -q release/firefox.xpi -d unpacked-firefox
        E2E_CHROME_EXT=unpacked-chrome E2E_FIREFOX_EXT=unpacked-firefox bun test test/e2e

    - name: Upload failure screenshots
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: e2e-screenshots
        path: test-results/
        if-no-files-found: ignore

    - name: Upload release files
      uses: actions/upload-artifact@v7
      with:
        name: release-files
        path: release/
        if-no-files-found: error

  check-chrome-credentials:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-26.04
    environment: release

    steps:
    - uses: actions/checkout@v7

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version-file: package.json

    - name: Check Chrome Web Store credentials (read-only)
      env:
        CWS_SERVICE_ACCOUNT_KEY: ${{ secrets.CWS_SERVICE_ACCOUNT_KEY }}
        CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
      run: bun scripts/publishChromeWebStore.ts --check

  publish-chrome:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-26.04
    environment: release

    steps:
    - uses: actions/checkout@v7

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version-file: package.json

    - name: Download release files
      uses: actions/download-artifact@v8
      with:
        name: release-files
        path: release

    - name: Upload and submit to the Chrome Web Store
      env:
        CWS_SERVICE_ACCOUNT_KEY: ${{ secrets.CWS_SERVICE_ACCOUNT_KEY }}
        CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
      run: bun scripts/publishChromeWebStore.ts release/chrome.zip

  publish-firefox:
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-26.04
    environment: release

    steps:
    - uses: actions/checkout@v7

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version-file: package.json

    - name: Install dependencies
      env:
        PUPPETEER_SKIP_DOWNLOAD: 'true'
      run: bun install --frozen-lockfile

    - name: Download release files
      uses: actions/download-artifact@v8
      with:
        name: release-files
        path: release

    # web-ext packs a directory itself, so sign the tested xpi's extracted contents.
    # Approval waiting is off: listed versions go through Mozilla's review, which
    # can take days. Validation or source-upload failures still fail this step.
    - name: Submit to Firefox Add-ons
      env:
        WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
        WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
      run: |
        unzip -q release/firefox.xpi -d unpacked-firefox
        bunx --bun web-ext sign \
          --source-dir unpacked-firefox \
          --channel listed \
          --upload-source-code release/source.zip \
          --approval-timeout 0
