name: CI

on:
  - push
  - pull_request

jobs:
  lint:
    runs-on: ubuntu-26.04

    steps:
    - uses: actions/checkout@v7

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version-file: package.json

    - name: Install dependencies
      run: bun install --frozen-lockfile

    # Type check, ESLint, unit tests, and Bright Builds checks. The extension build
    # exits 0 even when TypeScript reports errors, so the type check here is the gate.
    - name: Verify
      run: bun run verify

  web-ext-lint:
    runs-on: ubuntu-26.04

    steps:
    - uses: actions/checkout@v7

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version-file: package.json

    - name: Install dependencies
      run: bun install --frozen-lockfile

    - name: Run web-ext lint
      run: bun run web-ext:lint

  build:
    runs-on: ubuntu-26.04

    steps:
    - uses: actions/checkout@v7

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version-file: package.json

    - name: Install dependencies
      run: bun install --frozen-lockfile

    - name: Build extension
      run: bun run build:all

  e2e:
    runs-on: ubuntu-26.04

    steps:
    - uses: actions/checkout@v7

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version-file: package.json

    # Puppeteer downloads Chrome and Firefox during install; reuse them across runs.
    - name: Cache Puppeteer browsers
      uses: actions/cache@v6
      with:
        path: ~/.cache/puppeteer
        key: puppeteer-${{ runner.os }}-${{ hashFiles('bun.lock') }}

    - name: Install dependencies
      run: bun install --frozen-lockfile

    - name: Install test browsers
      run: bunx --bun puppeteer browsers install chrome && bunx --bun puppeteer browsers install firefox

    - name: Run UI tests in Chrome and Firefox
      run: bun run test:e2e

    - name: Upload failure screenshots
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: e2e-screenshots
        path: test-results/
        if-no-files-found: ignore
