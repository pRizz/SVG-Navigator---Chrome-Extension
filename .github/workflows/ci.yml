name: CI

on:
  - push
  - pull_request

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version-file: package.json

    - name: Install dependencies
      run: bun install --frozen-lockfile

    # The extension build exits 0 even when TypeScript reports errors, so this is the gate.
    - name: Type check
      run: bun run typecheck

    - name: Run ESLint
      run: bun run lint

    - name: Run unit tests
      run: bun run test:unit

  web-ext-lint:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version-file: package.json

    - name: Install dependencies
      run: bun install --frozen-lockfile

    - name: Run web-ext lint
      run: bun run web-ext:lint

  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version-file: package.json

    - name: Install dependencies
      run: bun install --frozen-lockfile

    - name: Build extension
      run: bun run build:all

  e2e:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version-file: package.json

    # Puppeteer downloads Chrome and Firefox during install; reuse them across runs.
    - name: Cache Puppeteer browsers
      uses: actions/cache@v4
      with:
        path: ~/.cache/puppeteer
        key: puppeteer-${{ runner.os }}-${{ hashFiles('bun.lock') }}

    - name: Install dependencies
      run: bun install --frozen-lockfile

    - name: Install test browsers
      run: bunx --bun puppeteer browsers install chrome && bunx --bun puppeteer browsers install firefox

    - name: Run UI tests in Chrome and Firefox
      run: bun run test:e2e

    - name: Upload failure screenshots
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: e2e-screenshots
        path: test-results/
        if-no-files-found: ignore
